name: bto-runner-bo
description: >-
  BTO Mode-Tracking BO Run — diagnoses and fixes the mode selection heuristic
  in the FDFD solver, runs Bayesian optimisation (Optuna TPE) on 8 BTO EO
  structures to find optimal geometries with reliable mode tracking, then
  generates publication-quality characterisation plots with literature comparison.

# ── Tunable constants (search-replace these values to adjust) ─────────────────
# BO_TIMEOUT_H      = 2.0     (per-structure BO timeout in hours)
# BO_MAX_EVALS      = 150     (per-structure max evaluations)
# BO_CONV_WINDOW    = 20      (convergence look-back window)
# BO_CONV_REL_TOL   = 0.01    (1% relative improvement threshold)
# BO_CONV_MIN_EVALS = 30      (minimum evals before convergence check)
# MESH_RESOLUTION   = 0.02    (µm — ~13s/eval)

# ── Prompt ────────────────────────────────────────────────────────────────────

prompt: |
  # BTO Mode-Tracking Bayesian Optimisation

  ## Context

  The `bto-sim/` solver package is already built and committed. Do NOT move,
  rename, or modify any existing file in `bto-sim/`. Your task: diagnose and
  fix the mode selection problem, run BO on 8 structures, and produce
  publication-quality plots.

  ## Physics solver

  ```python
  import sys
  sys.path.insert(0, 'bto-sim/py/solvers')
  from BTO_Sandwich_Flat import CombinedBTOFlatThinFilmSolver
  ```

  CRITICAL — set EO coefficients BEFORE every `extract_key_metrics()` call:
  ```python
  solver.r42 = <r42_SI>   # SI: m/V  (923 pm/V → 923e-12)
  solver.r51 = solver.r42
  solver.orientation = 'a-axis'
  solver.phi_deg = 0.0
  ```

  CRITICAL — NO RESULT REUSE:
  All numerical results must come from live solver calls in this session.
  Do NOT read or copy values from any file in the workspace.

  ## Known problem: mode selection

  The solver's `find_fundamental_mode_index()` (~line 1277) uses a heuristic
  `score = 0.7 * confinement + 0.3 * centering` to pick the fundamental TE0
  mode. This MISIDENTIFIES the target mode for low-index-contrast structures
  (sio2_patch, al2o3_patch at d_BTO=0.25µm), selecting HE1 instead of TE0.
  When this happens, VpiL and gamma values are unreliable.

  The solver has TWO existing methods that can help:
  - `track_mode_from_reference(ref_Ex, ref_Ey)` — tracks a mode across
    parameter changes by computing overlap integrals with a reference field
  - `select_seed_mode_max_topconf()` — selects the mode with maximum
    field confinement in the top core region

  Your FIRST task is to understand these methods, test them on known-failing
  cases, and build a robust mode selection wrapper for BO evaluations.

  ## Structure configurations (8 BTO structures)

  CombinedBTOFlatThinFilmSolver accepts top_core_material in
  {'sin','sio2','al2o3'} and spacer_material in {'air','sio2','al2o3','sin'}.

  ### Patch structures (no spacer)

  | ID            | top_core | spacer | spacer_thick_um | r42 pm/V | Reference          |
  |---------------|----------|--------|-----------------|----------|--------------------|
  | sin_patch     | sin      | air    | 0.0             | 923      | Eltes APL 2019     |
  | sio2_patch    | sio2     | air    | 0.0             | 923      |                    |
  | al2o3_patch   | al2o3    | air    | 0.0             | 923      |                    |
  | sin_patch_hq  | sin      | air    | 0.0             | 1340     | Eltes Nat.Mat. 2020|

  ### Sandwich structures (with spacer)

  | ID            | top_core | spacer | r42 pm/V |
  |---------------|----------|--------|----------|
  | sin_sio2      | sio2     | sin    | 923      |
  | sin_al2o3     | al2o3    | sin    | 923      |
  | sio2_al2o3    | al2o3    | sio2   | 923      |
  | al2o3_sio2    | sio2     | al2o3  | 923      |

  ## Fixed parameters

  ```python
  ELECTRODE_GAP    = 4.4    # µm (Eltes APL 2019)
  VOLTAGE          = 5.0    # V
  MESH             = 0.02   # µm (~13s/eval)
  ```

  ## BO parameter space

  Patch structures — 3 continuous dimensions:
  ```python
  bto_thickness_um  : [0.05,  0.50]
  sin_rib_width     : [0.5,   3.0]
  sin_rib_height    : [0.05,  0.35]
  ```

  Sandwich structures — 4 continuous dimensions:
  ```python
  bto_thickness_um  : [0.05,  0.50]
  sin_rib_width     : [0.5,   3.0]
  sin_rib_height    : [0.05,  0.35]
  spacer_thickness  : [0.02,  0.20]
  ```

  Fixed for all: electrode_gap=4.4, voltage=5.0, phi_deg=0.

  ## Your task — 5 phases

  ### PHASE 1 — Audit & Mode Selection Analysis

  1. Read `bto-sim/py/solvers/BTO_Sandwich_Flat.py` thoroughly. Focus on:
     - `find_fundamental_mode_index()` (~line 1277) — current heuristic
     - `track_mode_from_reference()` — overlap-based mode tracking
     - `select_seed_mode_max_topconf()` — top-core confinement selection
     - `solve_modes()` (~line 932) — eigenvalue solve, what it returns
     - `extract_key_metrics()` (~line 1367) — how it picks the mode today

  2. Run diagnostic solver calls on TWO known-failing configs:
     - sio2_patch:  d_BTO=0.25, w_rib=1.0, h_rib=0.15, gap=4.4
     - al2o3_patch: d_BTO=0.25, w_rib=1.0, h_rib=0.15, gap=4.4
     For each, call solve_modes(), then compare:
       a. Mode selected by find_fundamental_mode_index()
       b. Mode selected by select_seed_mode_max_topconf()
       c. TE fraction of each candidate mode (TE > 0.8 expected for TE0)
     Print: mode_index, TE_fraction, n_eff, confinement for the top 5 modes.

  3. Also test a KNOWN-WORKING config for comparison:
     - sin_patch: d_BTO=0.25, w_rib=1.0, h_rib=0.15, gap=4.4
     Verify that both methods agree on this one.

  4. Write `AUDIT.md` documenting:
     - The mode selection problem (which method works, which doesn't, and why)
     - Proposed fix strategy for the BO wrapper
     - Solver API summary (constructor params, key methods, output keys)
     - Risk notes (known failure modes, unit traps)

  Commit: `PHASE-1: audit — mode selection diagnosis`

  ### PHASE 2 — BO Script with Mode Tracking

  Write `run_bo.py` — a single self-contained script. Dependencies: numpy,
  scipy, matplotlib, optuna. All available in the conda env.

  The script must implement:

  1. **`evaluate_structure(structure_config, params, ref_fields=None)`**
     - Creates solver, sets all geometry params + r42/r51/orientation/phi_deg
     - Calls solve_modes()
     - Mode selection logic (YOUR KEY FIX):
       * If ref_fields is None (first eval or no reference): use
         select_seed_mode_max_topconf() or improved heuristic.
         Verify TE fraction > 0.7; if not, try next-best mode.
       * If ref_fields provided (subsequent BO evals): use
         track_mode_from_reference(ref_Ex, ref_Ey) to follow the same
         mode branch. Fall back to select_seed_mode_max_topconf() if
         overlap is poor (< 0.5).
     - Extracts metrics using the selected mode index (not the default one)
     - Returns: dict with v_pi_cm_V, loss_db_cm, n_eff, gamma, delta_n,
       mode_index, TE_fraction, success, and the mode fields (Ex, Ey)
       for subsequent tracking
     - On solver failure: returns dict with success=False, error message

  2. **`run_bo_for_structure(structure_id, structure_config, ...)`**
     - Creates Optuna study (TPE sampler, direction='minimize' for VpiL)
     - Each trial: suggest_float for bto_thickness, width, height
       (and spacer_thickness for sandwich structures)
     - Call evaluate_structure with mode tracking — pass ref_fields from
       the best-so-far evaluation to maintain mode branch continuity
     - Convergence check after each eval:
       * Take last 20 best-so-far VpiL values
       * If relative improvement < 1% AND at least 30 evals done → stop
     - Timeout: hard 2h wall-clock per structure
     - Max evals: 150 per structure
     - Log each eval to JSONL: output/bo_log_{structure_id}.jsonl
     - Returns: best params, best VpiL, all trial results, ref_fields of best

  3. **Main loop**: iterate over all 8 structures sequentially.
     Print progress: structure name, eval count, current best VpiL.
     Save output/plots/bo_results.json:
     ```json
     {"sin_patch": {"d_opt_um": 0.25, "w_opt_um": 1.5, "h_opt_um": 0.15,
                    "vpiL_Vcm": 0.18, "loss_dBcm": 0.5, "n_eff": 2.1,
                    "gamma": 0.35, "evals": 67, "time_s": 850,
                    "mode_tracking_used": true}, ...}
     ```

  Commit: `PHASE-2: BO script with mode tracking`

  ### PHASE 3 — Run BO on All 8 Structures

  Execute `run_bo.py`. Expected performance:
  - ~13s/eval at mesh=0.02
  - 50-100 evals/structure to converge (TPE is efficient in 3-4D)
  - 8 structures sequentially → ~1.5-3h total

  After completion, print a summary table:
  ```
  | Structure    | Best VpiL | d_BTO* | w_rib* | h_rib* | sp*  | Evals | Time  |
  |--------------|-----------|--------|--------|--------|------|-------|-------|
  | sin_patch    | 0.18      | 0.25   | 1.5    | 0.15   | —    | 67    | 14min |
  | ...          |           |        |        |        |      |       |       |
  ```

  If any structure fails to converge within 150 evals, note it but continue.

  Commit: `PHASE-3: BO optimisation complete — 8 structures`

  ### PHASE 4 — Publication Plots & Characterisation

  MANDATORY PRE-EXECUTION CHECK (P4):
  Before running the sweep script, perform a static code trace on every swept
  parameter. For each, verify the data path is unbroken:
    sweep loop variable → function argument → solver attribute setter
  Print a checklist like:
    [PASS] bto_thickness → evaluate_point(d_bto=...) → solver.bto_thickness = d_bto
    [FAIL] electrode_gap → gap=v (local only) → solver.electrode_gap = CONSTANT
  Do NOT proceed if any parameter fails. Fix the code first.

  MANDATORY POST-EXECUTION CHECK (P2-Enhanced):
  After sweeps complete, before committing, validate every sweep output:
    rel_range = (max(y) - min(y)) / (|mean(y)| + 1e-15)
  FAIL if rel_range < 1% for any parameter — it means the parameter is not
  being passed to the solver. Additionally:
    - electrode_gap vs VpiL: must be approximately linear (VpiL ~ g)
    - bto_thickness vs VpiL: must show decreasing trend
    - voltage vs delta_n: must be approximately linear
  Do NOT commit results that fail either check.

  Using the BO optima from Phase 3, run 1D characterisation sweeps WITH
  mode tracking (use ref_fields from each structure's BO optimum as the
  reference for all sweeps of that structure):

  a. **BTO thickness**: linspace(0.05, 0.50, 20) at optimal (w*, h*, sp*)
  b. **WG width**: linspace(0.5, 3.0, 20) at optimal (d*, h*, sp*)
  c. **Electrode gap**: linspace(2.5, 10.0, 16) at optimal (d*, w*, h*, sp*)
  d. **Crystal angle**: linspace(0, 90, 19) deg at optimal geometry
     For each phi: set solver.phi_deg = phi ONLY. Do NOT modify solver.r42.
     The solver internally rotates the full Pockels tensor (r13, r33, r42, r51)
     via _get_rotations() → eps_with_pockels(). Multiplying r42 by cos²(phi)
     externally would double-count the angular dependence.
  e. **Voltage**: linspace(1, 15, 15) V — delta_neff analytical only
  f. **Spacer thickness** (sandwich only): linspace(0.02, 0.20, 10) at (d*, w*, h*)

  Total: 8 structures × ~85 sweeps/structure = ~680 solver calls → ~2.5h

  Use ProcessPoolExecutor(max_workers=2) for the sweep dispatch.

  Generate publication plots (minimum 18 PNGs in output/plots/):
  Style: figsize=(10,6), dpi=150, tight_layout(), log-y for VpiL.
  Legend: "{id} (r42={r42} pm/V)"; analytical refs as dashed lines.
  Axis labels with units (µm, V·cm, dB/cm). Grid on.
  Use `open(path, 'w', encoding='utf-8')` for all file writes.

  Composite figure of merit: `score = -ln(VpiL * alpha_dB)` where VpiL is V·cm
  and alpha_dB is loss in dB/cm. Higher is better. Include in bar chart and results JSON.

  Required plots:
  - bo_convergence.png             (best-so-far VpiL vs eval# for all structures)
  - bo_results_bar.png             (bar chart: best VpiL per structure)
  - score_comparison.png           (bar chart: composite score per structure)
  - vpiL_vs_bto_thickness.png      (1D sweep, all structures, log-y)
  - loss_vs_bto_thickness.png
  - vpiL_vs_wg_width.png
  - loss_vs_wg_width.png
  - vpiL_vs_electrode_gap.png
  - loss_vs_electrode_gap.png
  - vpiL_vs_crystal_angle.png
  - delta_neff_vs_voltage.png
  - vpiL_vs_spacer_thickness.png   (sandwich structures only)
  - neff_vs_loss.png               (scatter coloured by VpiL)
  - gamma_comparison.png           (bar chart: gamma per structure)
  - geometry_sensitivity_<id>.png  (8 heatmaps from BO trial scatter)
  - literature_comparison.png      (simulation vs literature bands)
  - mode_tracking_diagnostics.png  (TE fraction & mode index across BO evals)

  Literature comparison (analytical reference lines only):
  ```python
  # LNOI: r33=27 pm/V, n=2.14, Gamma=0.35  [Wang Nat.Photon. 2018]
  # SOH:  r33=150 pm/V, n=1.65, Gamma=0.45 [Lauermann Optica 2016]
  VpiL_ref = (100 * 1.55 * g_um) / (n**3 * r33_pm_V * Gamma)
  ```

  Literature targets:
  - sin_patch (r42=923):     0.05 – 0.50 V·cm  [Eltes APL 2019]
  - sin_patch_hq (r42=1340): 0.03 – 0.30 V·cm  [Eltes Nat.Mat. 2020]
  - LNOI (analytical):       1.0  – 6.0  V·cm  [Wang Nat.Photon. 2018]
  - SOH  (analytical):       0.10 – 1.5  V·cm  [Lauermann Optica 2016]

  `within_order`: True if VpiL ∈ [target_min/10, target_max×10]

  Save output/plots/literature_comparison.json:
  ```json
  [{"structure": "sin_patch", "vpiL_Vcm": 0.18,
    "target_min": 0.05, "target_max": 0.50,
    "within_order": true, "reference": "Eltes APL 2019"}, ...]
  ```

  Commit: `PHASE-4: publication plots + literature comparison`

  ### PHASE 5 — Final Summary & Commit

  Print a comprehensive summary:
  1. BO results table (all 8 structures)
  2. Mode tracking effectiveness:
     - How many evals used tracking vs fresh selection?
     - Did tracking prevent any mode-hopping events?
     - Which structures had the most mode instability?
  3. Literature comparison: all within_order?
  4. Total wall-clock time and eval count

  Then print `##RUNNER:COMPLETE##`.

# ── Context anchors ───────────────────────────────────────────────────────────

context_anchors: |
  Repo: BTO_Modulators_Simulator, branch clauded
  bto-sim/ already exists — do NOT modify any file in it
  Solver type: FDFD (finite-difference frequency-domain), NOT FEM — uniform Yee grid, ARPACK eigensolver
  FDFD solver: bto-sim/py/solvers/BTO_Sandwich_Flat.py — CombinedBTOFlatThinFilmSolver
  KEY TASK: fix mode selection using track_mode_from_reference() / select_seed_mode_max_topconf()
  r42 in SI (m/V): 923 pm/V → 923e-12; set solver.r42 BEFORE every metrics call
  VpiL key: 'v_pi_cm_V' from solver; fallback: (100*1.55*4.4)/(n_eff**3*r42_pm_V*0.35)
  BO: Optuna TPE, 3D patch (d_BTO, w_rib, h_rib) / 4D sandwich (+spacer_thick)
  Convergence: rel_tol=1%, window=20, min_evals=30, timeout=2h/structure, max=150 evals
  Mesh: 0.02 µm (~13s/eval)
  Mode tracking: pass ref_fields from best-so-far to track_mode_from_reference()
  Fixed: electrode_gap=4.4, voltage=5.0, phi_deg=0
  NO RESULT REUSE: all numbers from live solver calls only
  Output: output/plots/ — minimum 18 PNG + bo_results.json + literature_comparison.json
  File writes: open(path,'w',encoding='utf-8')
  Windows: use cp1252-safe logging, no sys.stdout for non-ASCII
  Estimated total: ~6-9h (audit ~1h, coding ~2h, BO ~2-3h, sweeps ~2.5h, plots ~1h)

# ── Protocol ──────────────────────────────────────────────────────────────────

cccs:
  preset: cccs-v1.0
  profile: scisim

marathon_mode: false

# ── Model schedule ────────────────────────────────────────────────────────────

model_schedule:
  poll_interval_seconds: 30
  rules:
    - triggers:
        - token_pct_gte: 0.80
      action:
        model_id: claude-sonnet-4-6
        message: "Context near limit — switching to Sonnet"

# ── Sandbox ───────────────────────────────────────────────────────────────────

sandbox:
  backend: native
  working_dir: C:/Doc_PhD_ORC/bto-runner-bo

# ── Execution ─────────────────────────────────────────────────────────────────

execution:
  timeout_hours: 12
  max_rate_limit_waits: 50
  skip_permissions: true
  resume_strategy: restate
  silence_timeout_minutes: 2880

  milestones:
    - pattern: "PHASE-1:"
      message: "Phase 1 — audit & mode selection diagnosis complete"
    - pattern: "PHASE-2:"
      message: "Phase 2 — BO script with mode tracking written"
    - pattern: "PHASE-3:"
      message: "Phase 3 — BO optimisation complete for 8 structures"
    - pattern: "PHASE-4:"
      message: "Phase 4 — publication plots + literature comparison"
    - pattern: "PHASE-5:"
      message: "All phases complete"

  context:
    checkpoint_threshold_tokens: 80000

# ── Output ────────────────────────────────────────────────────────────────────

output:
  git:
    enabled: true
    auto_push: false
    remote_url: https://github.com/LunaticSodium/BTO_Modulators_Simulator.git
    branch_prefix: bto-run/

# ── ntfy.sh ───────────────────────────────────────────────────────────────────

ntfy:
  out_channel: claude-runner-honacoo
  cmd_channel: claude-runner-honacoo-cmd

notify:
  on: [start, complete, error, rate_limit, milestone, resume]
  channels:
    - type: desktop
    - type: webhook
      url: https://ntfy.sh/claude-runner-honacoo

# ── Acceptance criteria ───────────────────────────────────────────────────────

acceptance_criteria:
  on_failure: retry
  max_retries: 2
  checks:
    - type: file_exists
      path: AUDIT.md
    - type: file_exists
      path: run_bo.py
    - type: file_exists
      path: output/plots/bo_results.json
    - type: file_exists
      path: output/plots/literature_comparison.json
    - type: command
      run: "C:/Users/20894/miniconda3/envs/bto_ml/python.exe -c \"import json,sys; data=json.load(open('output/plots/bo_results.json')); n=len(data); print(f'Structures optimised: {n}'); sys.exit(0 if n>=8 else 1)\""
      expect_exit: 0
    - type: command
      run: "C:/Users/20894/miniconda3/envs/bto_ml/python.exe -c \"import pathlib,sys; d=pathlib.Path('output/plots'); pngs=list(d.glob('*.png')) if d.exists() else []; n=len(pngs); print('Plots:', n); [print(' ', p.name) for p in sorted(pngs)]; sys.exit(0 if n>=18 else 1)\""
      expect_exit: 0
    - type: command
      run: "C:/Users/20894/miniconda3/envs/bto_ml/python.exe -c \"import json,sys; data=json.load(open('output/plots/literature_comparison.json')); mismatches=[r['structure'] for r in data if not r.get('within_order',True)]; print('Mismatches:', mismatches or 'none'); sys.exit(0)\""
      expect_exit: 0

# ── Implementation constraints (v2.1 — prevent worker parameter override) ────

implementation_constraints:
  - id: r42-si-units
    description: "Solver r42 must be set in SI (m/V) using 1e-12 conversion"
    verify_with: file_contains
    file: run_bo.py
    pattern: "r42.*1e-12|1e-12.*r42"

  - id: mode-tracking
    description: "BO must use track_mode_from_reference or select_seed_mode_max_topconf"
    verify_with: file_contains
    file: run_bo.py
    pattern: "track_mode_from_reference|select_seed_mode_max_topconf"

  - id: utf8-stdout
    description: "Script must handle Windows cp1252 encoding safely"
    verify_with: file_contains
    file: run_bo.py
    pattern: "reconfigure.*utf-8|encoding.*utf"

  - id: no-hardcoded-gap
    description: "Sweep script must pass electrode_gap through, not hardcode it"
    verify_with: file_contains
    file: run_sweeps_and_plots.py
    pattern: "def.*gap|electrode_gap.*=.*gap"

  - id: composite-score
    description: "Results must include composite score = -ln(VpiL * loss)"
    verify_with: file_contains
    file: run_bo.py
    pattern: "log.*[Vv]pi.*loss|ln.*[Vv]pi.*alpha|-.*log.*\\*"

# ── Physics constraints (v2.2) ───────────────────────────────────────────────

physics_constraints:
  - name: positive_vpiL
    check: "0 < VpiL < 100 V·cm"
    message: "VpiL must be positive and below 100 V·cm"
  - name: neff_range
    check: "1.4 < n_eff < 2.5"
    message: "n_eff must be between SiO2 substrate and BTO"
